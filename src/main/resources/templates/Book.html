<!DOCTYPE html>
<html>
<head>
<title>Books</title>

<style>

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:12px;
border:1px solid #ddd;
}

th{
background:#2c3e50;
color:white;
}

button{
padding:8px 15px;
cursor:pointer;
}

</style>

</head>
<body>

<h1>Books Management</h1>

<a href="/add-book">
<button>Add Book</button>
</a>

<table>
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Quantity</th>
        </tr>
    </thead>

    <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.id}"></td>
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.quantity}"></td>
        </tr>
    </tbody>
</table>

</body>
</html>
