<!DOCTYPE html>
<html>
<head>
<title>Issues</title>
<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

h1{
    color:#2c3e50;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

th{
    background:#2c3e50;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f9fa;
}

button{
    background:#3498db;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

.return-btn{
    background:#27ae60;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.return-btn:hover{
    background:#1e8449;
}

</style>
</head>

<body>

<h1>Issued Books</h1>

<a href="/issue-book">
<button>Issue Book</button>
</a>

<table>
	<thead>
		<tr>
			<th>Issue ID</th>
			<th>Book ID</th>
			<th>User ID</th>
			<th>Issue Date</th>
			<th>Return Date</th>
			<th>Fine</th>
			<th>Status</th>
			<th>Action</th>
		</tr>
	</thead>
	
<tbody>
    <tr th:each="issue : ${issues}">
        <td th:text="${issue.id}"></td>
        <td th:text="${issue.bookId}"></td>
        <td th:text="${issue.userId}"></td>
        <td th:text="${issue.issueDate}"></td>
        <td th:text="${issue.returnDate}"></td>
        <td th:text="${issue.fine}"></td>
		<td>
		    <span th:text="${issue.returned ? 'Returned' : 'Issued'}"></span>
		</td>
        <td>
	    <a th:href="@{/return-book/{id}(id=${issue.id})}">
	        <button class="return-btn">Return</button>
	    </a>
		</td>
    </tr>
</tbody>

</table>

</body>
</html>
