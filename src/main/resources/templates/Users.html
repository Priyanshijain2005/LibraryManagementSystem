<!DOCTYPE html>
<html>
<head>
<title>Users</title>
<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

h1{
    color:#2c3e50;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

th{
    background:#34495e;
    color:white;
    padding:12px;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

tr:hover{
    background:#f8f9fa;
}

.delete-btn{
    background:#e74c3c;
    color:white;
    border:none;
    padding:8px 15px;
    border-radius:5px;
    cursor:pointer;
}

.delete-btn:hover{
    background:#c0392b;
}

button{
    background:#3498db;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#2980b9;
}

</style>
</head>

<body>

<h1>Users</h1>

<a href="/add-user">
<button>Add User</button>
</a>

<table>
	<thead>
		<tr>
			<th>ID</th>
			<th>Name</th>
			<th>Email</th>
			<th>Phone</th>
			<th>Action</th>
		</tr>	
	</thead>
	<tbody>
		<tr th:each="user : ${users}">
			<td th:text="${user.id}"></td>
			<td th:text="${user.name}"></td>
			<td th:text="${user.email}"></td>
			<td th:text="${user.phone}"></td>
			<td><a th:href="@{/delete-user/{id}(id=${user.id})}">
		        <button class="delete-btn">Delete</button>
		    </a></td>
			
		</tr>
	</tbody>
</table>

</body>
</html>
